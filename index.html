
<div id="mobileAccess">
    <a href="https://nieuweschoolfotos.github.io/fotos/"
       class="btn">
        📱 Ga naar de website →
    </a>
</div>

<div id="desktopMessage" style="display:none;">
    <div style="
        background:#fff7ed;
        border:1px solid #fed7aa;
        padding:18px;
        border-radius:13px;
        color:#9a3412;
        font-size:14px;
        line-height:1.7;
    ">
        <strong>📱 Alleen toegankelijk via mobiel</strong>
        <br>
        Deze website is alleen beschikbaar op mobiele apparaten.
        Open deze pagina op je smartphone of tablet.
    </div>
</div>

<script>
    function checkDevice() {
        const isMobile = /Android|iPhone|iPad|iPod|Mobile/i
            .test(navigator.userAgent);

        document.getElementById("mobileAccess").style.display =
            isMobile ? "block" : "none";

        document.getElementById("desktopMessage").style.display =
            isMobile ? "none" : "block";
    }

    checkDevice();
</script>
